<section id="select" class="screen select-screen" hidden>
<p class="eyebrow"><span data-pixel="BOUNCE BALL ARENA"></span> / V0.4 · COIN SHOP</p>
<h1><span data-pixel="選擇你的球"></span></h1>
<p class="intro">選一顆球開始爬塔。擊倒敵人或在場內撿金幣，即可在樓層之間購買裝備。</p>
<div id="roster" class="roster" role="group" aria-label="你的球"></div>
<div class="choose-footer"><span class="hint">TOWER MODE · 從第 1 層開始</span><button class="secondary" id="browseShop">裝備商店</button><button class="primary" id="enter" aria-label="開始爬塔" disabled>開始爬塔</button></div>
</section>
<section id="shop" class="screen select-screen" hidden>
<p class="eyebrow">EQUIPMENT SHOP</p>
<h1>裝備商店</h1>
<div class="shop-status"><span id="shopStage"></span><strong id="shopGold" aria-live="polite"></strong></div>
<p class="intro">裝備可重複購買，效果疊加，僅在本次爬塔有效。</p>
<div class="shop-grid" id="shopItems"></div>
<div class="choose-footer"><span id="shopNotice" class="hint" aria-live="polite"></span><button id="leaveShop" class="primary">繼續爬塔</button></div>
</section>
<section id="play" class="screen play" hidden>
<div class="tower-head"><div id="floorLabel" class="eyebrow"></div><div id="floorEnemy" class="hint"></div><strong class="gold" id="gold"></strong></div>
<div class="hud">
<div class="fighter" id="fighter0"><small>1P</small> <span id="name0"></span> <span id="hp0" class="hptext"></span><div class="track"><i></i></div><div id="reboundHeal" class="progress"></div></div>
<div class="timer" id="timer">75</div>
<div class="fighter" id="fighter1"><small>敵方</small> <span id="name1"></span> <span id="hp1" class="hptext"></span><div class="track"><i></i></div><div id="walls1" class="progress"></div></div>
</div>
<div class="field">

<div class="result" id="result" hidden><div><h2 id="outcome"></h2><p id="reason"></p><button id="again" class="primary">從第 1 層重來</button></div></div>

<div class="loadouts"><span id="loadout0"></span><span id="loadout1"></span></div>
<div class="controls"><span id="hint" class="hint" aria-live="polite"></span><div><button id="sound" class="secondary" type="button" aria-label="碰撞音效" aria-pressed="true">音效開</button><button id="reset" class="secondary">重打本層</button><button id="back" class="secondary">換球</button></div></div>
</section>

  state='end';stop();
  $('outcome').textContent='止步第 '+run.floor+' 層';
  $('reason').textContent=balls[0].hp<=0?'血量歸零。本次爬塔結束。':'時間到，敵人還沒清完。';
  $('hint').textContent='已通過 '+(run.floor-1)+' 層 · 本次剩餘 '+run.gold+' G';$('result').hidden=false;$('again').focus();
}
function hitBurst(x,y){
  for(let i=0;i<26;i++){
    const a=i*Math.PI*2/26+Math.sin(i*21)*.17,v=45+(i%7)*18;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,start:t,color:i%3===0?'#fff':i%3===1?'#ffe168':'#ff923f',size:2+i%3});
  }
}
function contactAttack(s,o,nx,ny){
  if(s.type.id==='dummy'){change(s,-1,true);return false;}
  let damage=s.team===0?1+run.power:s.type.id==='grunt'?1+s.pressure:s.pressure;
  if(s.type.id==='tank'){
    damage+=tankHit;change(s,-1,true);
  }
  if(count(s,'spike')&&t>=s.spikeAt){s.spikeAt=t+1;damage+=count(s,'spike');}
  if(count(s,'echo')){
    s.echoes.push({x:s.x,y:s.y,start:t+1,until:t+3});
    if(s.echoes.length>count(s,'echo'))s.echoes.shift();
  }
  if(s.type.id==='charge'&&s.energy===3){
    s.energy=0;damage+=chargeHit;push(o,nx,ny,350);burst(s,40);
  }
  const crit=damage>0&&s.team===0&&Math.random()<Math.min(1,.12+.03*run.power);
  if(crit){
    damage*=2;
    const x=(s.x+o.x)/2,y=(s.y+o.y)/2;
    hitBurst(x,y);floats.push({x,y:y-7,start:t,label:'爆擊！',color:'#ffe168',crit:true});
  }
  if(damage){
    const dealt=-change(o,-damage);
    if(s.team===0&&s.hp>0&&dealt>0&&gearCount('drain')){
      // Store units of 1/5 HP so repeated small hits do not lose healing to rounding.
      run.drainCharge+=dealt*gearCount('drain');
      const heal=Math.floor(run.drainCharge/5);
      run.drainCharge%=5;
      if(heal)change(s,heal);
    }
  }
  return crit;
}
function activeOpponents(s){return balls.filter(o=>o.hp>0&&o.team!==s.team);}
function update(dt){
  t+=dt;
  const player=balls[0],active=balls.filter(s=>s.hp>0);
  if(grip&&(grip.vamp.hp<=0||grip.target.hp<=0))grip=null;
  for(const s of active){
    if(grip?.target===s)continue;
    move(s,dt);
  }
  if(grip){
    const {vamp,target}=grip;
    place(target,vamp.x+grip.x*(2*R-1),vamp.y+grip.y*(2*R-1));
    if(hypot(target.x-vamp.x,target.y-vamp.y)<R){
      grip.x*=-1;grip.y*=-1;
      place(target,vamp.x+grip.x*(2*R-1),vamp.y+grip.y*(2*R-1));
    }
    while(grip.ticks<vampTicks&&t>=grip.next){
      if(target.hp>0){const drained=-change(target,-1);if(drained)change(vamp,drained);}
      grip.next+=.4;grip.ticks++;
    }
    if(t>=grip.end||target.hp<=0){
      const n=vec(target,vamp),nx=n.n?n.x:grip.x,ny=n.n?n.y:grip.y;
      push(target,nx,ny,215);push(vamp,-nx,-ny,215);
      vamp.ready=t+vampCooldown;grip=null;
    }
  }
  for(const s of active){
    if(s.type.id!=='wave'||t<s.ready||s.hp<=0||grip?.target===s)continue;
    const targets=activeOpponents(s).filter(o=>hypot(s.x-o.x,s.y-o.y)<=2*R+17);
    if(!targets.length)continue;
    s.ready=t+waveCooldown;burst(s,46);
    for(const o of targets){const n=vec(o,s);change(o,-waveHit);push(o,n.n?n.x:1,n.y,290);}
  }
  for(let i=0;i<active.length;i++)for(let j=i+1;j<active.length;j++){
    const a=active[i],b=active[j],key=a.id+':'+b.id;
    if(a.hp<=0||b.hp<=0)continue;
    const n=vec(b,a),nx=n.n?n.x:1,ny=n.y;
    if(n.n>2*R){if(n.n>2*R+1)contacts.delete(key);continue;}
    if(grip&&(grip.target===a||grip.target===b)){
      if((grip.vamp===a&&grip.target===b)||(grip.vamp===b&&grip.target===a))contacts.add(key);
      continue;
    }
    const closing=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny,correction=(2*R-n.n+.2)/2;
    place(a,a.x-correction*nx,a.y-correction*ny);
    place(b,b.x+correction*nx,b.y+correction*ny);
    bouncePair(a,b,nx,ny,closing);
    if(contacts.has(key))continue;
    contacts.add(key);
    if(a.team===b.team)continue;
    // Both sides resolve the collision even if the first hit was lethal.
    const critA=contactAttack(a,b,nx,ny),critB=contactAttack(b,a,-nx,-ny);
    impact(critA||critB?'crit':'body',nx,ny,Math.max(0,closing));
    const vampires=[a,b].filter(s=>s.type.id==='vamp'&&t>=s.ready);
    if(!grip&&vampires.length===1&&a.hp>0&&b.hp>0){
      const vamp=vampires[0],target=vamp===a?b:a,dir=vamp===a?1:-1;
      grip={vamp,target,x:nx*dir,y:ny*dir,next:t+.4,end:t+.4*vampTicks,ticks:0};
    }
  }
  for(const s of active){
    const v=hypot(s.vx,s.vy),min=132*BASE_SPEED_GAIN*speedScale(s);
    if(v<min)redirect(s,s.vx,s.vy,min,s.team?-1:1,0);
  }
  beams=beams.filter(l=>l.until>t&&l.owner.hp>0);
  for(const l of beams)for(const s of activeOpponents(l.owner)){
    const d=distLine(s,l);
    if(d<=R&&!l.touch.has(s)){
      l.touch.add(s);
      if(t>=(s.laserReady.get(l.owner.id)||0)){change(s,-laserHit);s.laserReady.set(l.owner.id,t+laserCooldown);}
    }else if(d>R+2)l.touch.delete(s);
  }
  for(const s of active){
    if(s.hp<=0)continue;
    for(const key of ['mines','echoes'])if(s[key].length)s[key]=s[key].filter(trap=>{
      if(t>=trap.until)return false;
      const o=t>=trap.start&&activeOpponents(s).find(o=>hypot(trap.x-o.x,trap.y-o.y)<=R+7);
      if(o){change(o,-2);return false;}
      return true;
    });
  }
  shots=shots.filter(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.owner.hp<=0||t>=p.until||!inside(p))return false;
    const o=activeOpponents(p.owner).find(o=>hypot(p.x-o.x,p.y-o.y)<=R+3);
    if(o){change(o,-2);return false;}
    return true;
  });
  settleEnemyDrops();updateCoins(player);
  floats=floats.filter(f=>t-f.start<(f.crit||f.gold?.85:.65));sparks=sparks.filter(f=>t-f.start<.3);
  particles=particles.filter(f=>t-f.start<.48);
  if(Math.floor(t*40)!==Math.floor((t-dt)*40))for(const s of active){s.trail.push([s.x,s.y]);if(s.trail.length>7)s.trail.shift();}
  if(player.hp<=0)finish(false);
  else if(balls.slice(1).every(s=>s.hp<=0))finish(true);
  else if(t>=TIME)finish(false);
}
function frame(now){
  if(state!=='run')return;
  if(last)acc+=Math.min((now-last)/1000,.06);
  last=now;
  while(acc>=STEP&&state==='run'){update(STEP);acc-=STEP;}
  hud();render();
  if(state==='run')raf=requestAnimationFrame(frame);
}
function line(x,y,X,Y,color,width=1){
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke();
}
function sprite(b,x=b.x,y=b.y,aim=false){
  x=Math.round(x);y=Math.round(y);
  ctx.fillStyle=b.flash>t?'#fff':b.type.color;
  for(const [off,width,high] of [[-13,12,2],[-11,20,3],[-8,24,3],[-5,26,10],[5,24,3],[8,20,3],[11,12,2]])ctx.fillRect(x-width/2,y+off,width,high);
  ctx.fillStyle='#111117';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.hp,x,y+1);
  if(aim)return;
  if(b.shield){ctx.strokeStyle='#7af5ec';ctx.strokeRect(x-18.5,y-18.5,37,37);}
  if(count(b,'spike')){
    ctx.fillStyle='#fff3a0';
    const teeth=Math.min(24,8+2*(count(b,'spike')-1));
    for(let i=0;i<teeth;i++){
      const a=i*2*Math.PI/teeth;ctx.beginPath();
      for(const [d,r] of [[-.13,12],[0,18],[.13,12]]){const px=x+Math.cos(a+d)*r,py=y+Math.sin(a+d)*r;d===-.13?ctx.moveTo(px,py):ctx.lineTo(px,py);}
      ctx.fill();
    }
  }
  if(b.type.id==='charge')for(let i=0;i<3;i++){ctx.fillStyle=i<b.energy?b.type.color:'#504130';ctx.fillRect(x-10+i*7,y-19,5,3);}
  if(b.type.id==='wave'&&t>=b.ready){ctx.strokeStyle=b.type.color;ctx.strokeRect(x-16.5,y-16.5,33,33);}
  if(b.type.id==='laser'&&b.wall){ctx.fillStyle=b.type.color;ctx.fillRect(clamp(b.wall.x-2,0,W-4),clamp(b.wall.y-2,0,W-4),4,4);}
}
function render(){
  ctx.clearRect(0,0,W,W);
  if(!balls.length)return;
  ctx.save();arenaPath();ctx.clip();
  for(const l of beams){
    ctx.globalAlpha=clamp((l.until-t)*2,.12,1);
    line(l.a.x,l.a.y,l.b.x,l.b.y,l.owner.type.color,2);
    ctx.fillStyle='#fff';for(const p of [l.a,l.b])ctx.fillRect(clamp(p.x-2,0,W-4),clamp(p.y-2,0,W-4),4,4);
  }
  ctx.globalAlpha=1;
  if(state==='idle'){
    for(const enemy of balls.slice(1))sprite(enemy,enemy.x,enemy.y,true);
    const a=drag?.origin||balls[0];sprite(balls[0],a.x,a.y,true);
    const v=drag?pullVector(drag,drag.end):keyAim?{x:Math.cos(keyAim.a),y:Math.sin(keyAim.a),n:keyAim.n}:null;
    if(v&&v.n>=5){
      const power=clamp((v.n-5)/120,0,1),len=27+power*77;
      const x=a.x+v.x*len,y=a.y+v.y*len,c=balls[0].type.color;
      if(drag){ctx.setLineDash([3,4]);line(a.x,a.y,drag.end.x,drag.end.y,'#898995');ctx.setLineDash([]);}
      line(a.x+v.x*15,a.y+v.y*15,x,y,c,2);
      line(x,y,x-v.x*8-v.y*5,y-v.y*8+v.x*5,c,2);
      line(x,y,x-v.x*8+v.y*5,y-v.y*8-v.x*5,c,2);
      ctx.fillStyle='#242429';ctx.fillRect(W/2-58,W-29,116,8);ctx.fillStyle=c;ctx.fillRect(W/2-58,W-29,Math.max(4,116*power),8);
    }
    endArena();return;
  }
  for(const c of coins){
    ctx.fillStyle='#ffce50';ctx.fillRect(Math.round(c.x)-4,Math.round(c.y)-5,8,10);
    ctx.fillRect(Math.round(c.x)-5,Math.round(c.y)-3,10,6);
    ctx.fillStyle='#ac650e';ctx.fillRect(Math.round(c.x)-1,Math.round(c.y)-3,2,6);
  }
  for(const s of balls){
    if(s.hp<=0)continue;
    for(const mine of s.mines){ctx.fillStyle=s.type.color;ctx.fillRect(mine.x-5,mine.y-5,10,10);ctx.fillStyle='#fff';ctx.fillRect(mine.x-1,mine.y-1,2,2);}
    for(const echo of s.echoes){ctx.globalAlpha=t<echo.start?.28:.75;ctx.strokeStyle=s.type.color;ctx.setLineDash([3,2]);ctx.strokeRect(echo.x-8,echo.y-8,16,16);ctx.setLineDash([]);ctx.globalAlpha=1;}
  }
  for(const p of shots){const sp=hypot(p.vx,p.vy);line(p.x-p.vx/sp*8,p.y-p.vy/sp*8,p.x+p.vx/sp*3,p.y+p.vy/sp*3,p.owner.type.color,3);}
  if(grip)line(grip.vamp.x,grip.vamp.y,grip.target.x,grip.target.y,'#ff5778',7);
  for(const s of balls){
    if(s.hp<=0)continue;
    for(const [i,[x,y]] of s.trail.entries()){
      ctx.globalAlpha=(i+1)*.043;ctx.fillStyle=s.type.color;ctx.fillRect(Math.round(x)-3,Math.round(y)-3,6,6);
    }ctx.globalAlpha=1;sprite(s);
  }
  for(const f of sparks){const u=(t-f.start)/.3,r=10+u*f.r;ctx.globalAlpha=1-u;ctx.strokeStyle=f.color;ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4,x=f.x+Math.cos(a)*r,y=f.y+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.stroke();}
  if(!reducedMotion?.matches)for(const p of particles){
    const age=t-p.start;ctx.globalAlpha=1-age/.48;ctx.fillStyle=p.color;
    ctx.fillRect(Math.round(p.x+p.vx*age),Math.round(p.y+p.vy*age+55*age*age),p.size,p.size);
  }
  for(const f of floats){
    const u=(t-f.start)/(f.crit||f.gold?.85:.65);ctx.globalAlpha=1-u;ctx.fillStyle=f.color;
    ctx.font=f.crit?'900 20px system-ui':f.dodge?'bold 14px system-ui':'bold 15px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    const {x,y}=inset({x:f.x,y:f.y-17-u*20},f.crit||f.gold?22:f.dodge?17:12);
    if(f.crit){ctx.lineWidth=4;ctx.strokeStyle='#3d1e04';ctx.strokeText(f.label,x,y);}
    ctx.fillText(f.label,x,y);
  }
  ctx.globalAlpha=1;
  endArena();
}
function endArena(){
  ctx.restore();arenaPath();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
}
</script>
