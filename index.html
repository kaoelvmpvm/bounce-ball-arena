  osc.frequency.setValueAtTime((crit?370:body?192:530)+strength*(body?82:150),now);

    if(n.n>2*R){if(n.n>2*R+1)contacts.delete(key);continue;}
    if(grip&&(grip.target===a||grip.target===b)){
      if((grip.vamp===a&&grip.target===b)||(grip.vamp===b&&grip.target===a))contacts.add(key);
      continue;
    }
    const closing=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny,correction=(2*R-n.n+.2)/2;
    a.x=clamp(a.x-correction*nx,R,W-R);a.y=clamp(a.y-correction*ny,R,W-R);
    b.x=clamp(b.x+correction*nx,R,W-R);b.y=clamp(b.y+correction*ny,R,W-R);
    if(closing>0){a.vx-=closing*nx;a.vy-=closing*ny;b.vx+=closing*nx;b.vy+=closing*ny;}
    if(contacts.has(key))continue;
    contacts.add(key);
    if(a.team===b.team)continue;
    // Both sides resolve the collision even if the first hit was lethal.
    const critA=contactAttack(a,b,nx,ny),critB=contactAttack(b,a,-nx,-ny);
    impact(critA||critB?'crit':'body',nx,ny,Math.max(0,closing));
    const vampires=[a,b].filter(s=>s.type.id==='vamp'&&t>=s.ready);
    if(!grip&&vampires.length===1&&a.hp>0&&b.hp>0){
      const vamp=vampires[0],target=vamp===a?b:a,dir=vamp===a?1:-1;
      grip={vamp,target,x:nx*dir,y:ny*dir,next:t+.4,end:t+.4*vampTicks,ticks:0};
    }
  }
  for(const s of active){
    const v=hypot(s.vx,s.vy),scale=speedScale(s),min=132*scale,max=440*scale;
    if(t<(s.knockEnd||0)&&v>0)continue;
    if(!v)s.vx=(s.team?-1:1)*min;
    else if(v<min||v>max){const k=clamp(v,min,max)/v;s.vx*=k;s.vy*=k;}
  }
  beams=beams.filter(l=>l.until>t&&l.owner.hp>0);
  for(const l of beams)for(const s of activeOpponents(l.owner)){
    const d=distLine(s,l);
    if(d<=R&&!l.touch.has(s)){
      l.touch.add(s);
      if(t>=(s.laserReady.get(l.owner.id)||0)){change(s,-laserHit);s.laserReady.set(l.owner.id,t+laserCooldown);}
    }else if(d>R+2)l.touch.delete(s);
  }
  for(const s of active){
    if(s.hp<=0)continue;
    for(const [i,satellite] of s.satellites.entries()){
      if(t<satellite.ready)continue;
      const p=orbit(s,i),o=activeOpponents(s).find(o=>hypot(p.x-o.x,p.y-o.y)<=R+4);
      if(o){change(o,-1);satellite.ready=t+1.2;}
    }
    for(const key of ['mines','echoes'])if(s[key].length)s[key]=s[key].filter(trap=>{
      if(t>=trap.until)return false;
      const o=t>=trap.start&&activeOpponents(s).find(o=>hypot(trap.x-o.x,trap.y-o.y)<=R+7);
      if(o){change(o,-2);return false;}
      return true;
    });
  }
  shots=shots.filter(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.owner.hp<=0||t>=p.until||p.x<0||p.x>W||p.y<0||p.y>W)return false;
    const o=activeOpponents(p.owner).find(o=>hypot(p.x-o.x,p.y-o.y)<=R+3);
    if(o){change(o,-2);return false;}
    return true;
  });
  floats=floats.filter(f=>t-f.start<(f.crit?.85:.65));sparks=sparks.filter(f=>t-f.start<.3);
  particles=particles.filter(f=>t-f.start<.48);
  if(Math.floor(t*40)!==Math.floor((t-dt)*40))for(const s of active){s.trail.push([s.x,s.y]);if(s.trail.length>7)s.trail.shift();}
  if(player.hp<=0)finish(false);
  else if(balls.slice(1).every(s=>s.hp<=0))finish(true);
  else if(t>=TIME)finish(false);
  else if(player.pending)offerDraft();
}
function frame(now){
  if(state!=='run')return;
  if(last)acc+=Math.min((now-last)/1000,.06);
  last=now;
  while(acc>=STEP&&state==='run'){update(STEP);acc-=STEP;}
  hud();render();
  if(state==='run')raf=requestAnimationFrame(frame);
}
function line(x,y,X,Y,color,width=1){
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke();
}
function sprite(b,x=b.x,y=b.y,aim=false){
  x=Math.round(x);y=Math.round(y);
  ctx.fillStyle=b.flash>t?'#fff':b.type.color;
  for(const [off,width,high] of [[-13,12,2],[-11,20,3],[-8,24,3],[-5,26,10],[5,24,3],[8,20,3],[11,12,2]])ctx.fillRect(x-width/2,y+off,width,high);
  ctx.fillStyle='#111117';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.hp,x,y+1);
  if(aim)return;
  if(b.shield){ctx.strokeStyle='#7af5ec';ctx.strokeRect(x-18.5,y-18.5,37,37);}
  if(count(b,'spike')){
    ctx.fillStyle='#fff3a0';
    const teeth=Math.min(24,8+2*(count(b,'spike')-1));
    for(let i=0;i<teeth;i++){
      const a=i*2*Math.PI/teeth;ctx.beginPath();
      for(const [d,r] of [[-.13,12],[0,18],[.13,12]]){const px=x+Math.cos(a+d)*r,py=y+Math.sin(a+d)*r;d===-.13?ctx.moveTo(px,py):ctx.lineTo(px,py);}
      ctx.fill();
    }
  }
  if(b.type.id==='charge')for(let i=0;i<3;i++){ctx.fillStyle=i<b.energy?b.type.color:'#504130';ctx.fillRect(x-10+i*7,y-19,5,3);}
  if(b.type.id==='wave'&&t>=b.ready){ctx.strokeStyle=b.type.color;ctx.strokeRect(x-16.5,y-16.5,33,33);}
  if(b.type.id==='laser'&&b.wall){ctx.fillStyle=b.type.color;ctx.fillRect(clamp(b.wall.x-2,0,W-4),clamp(b.wall.y-2,0,W-4),4,4);}
}
function render(){
  ctx.clearRect(0,0,W,W);
  if(!balls.length)return;
  for(const l of beams){
    ctx.globalAlpha=clamp((l.until-t)*2,.12,1);
    line(l.a.x,l.a.y,l.b.x,l.b.y,l.owner.type.color,2);
    ctx.fillStyle='#fff';for(const p of [l.a,l.b])ctx.fillRect(clamp(p.x-2,0,W-4),clamp(p.y-2,0,W-4),4,4);
  }
  ctx.globalAlpha=1;
  if(state==='idle'){
    for(const enemy of balls.slice(1))sprite(enemy,enemy.x,enemy.y,true);
    const a=drag?.origin||balls[0];sprite(balls[0],a.x,a.y,true);
    const v=drag?pullVector(drag,drag.end):keyAim?{x:Math.cos(keyAim.a),y:Math.sin(keyAim.a),n:keyAim.n}:null;
    if(v&&v.n>=5){
      const power=clamp((v.n-5)/120,0,1),len=27+power*77;
      const x=a.x+v.x*len,y=a.y+v.y*len,c=balls[0].type.color;
      if(drag){ctx.setLineDash([3,4]);line(a.x,a.y,drag.end.x,drag.end.y,'#898995');ctx.setLineDash([]);}
      line(a.x+v.x*15,a.y+v.y*15,x,y,c,2);
      line(x,y,x-v.x*8-v.y*5,y-v.y*8+v.x*5,c,2);
      line(x,y,x-v.x*8+v.y*5,y-v.y*8-v.x*5,c,2);
      ctx.fillStyle='#242429';ctx.fillRect(W/2-58,W-29,116,8);ctx.fillStyle=c;ctx.fillRect(W/2-58,W-29,Math.max(4,116*power),8);
    }
    return;
  }
  for(const s of balls){
    if(s.hp<=0)continue;
    for(const mine of s.mines){ctx.fillStyle=s.type.color;ctx.fillRect(mine.x-5,mine.y-5,10,10);ctx.fillStyle='#fff';ctx.fillRect(mine.x-1,mine.y-1,2,2);}
    for(const echo of s.echoes){ctx.globalAlpha=t<echo.start?.28:.75;ctx.strokeStyle=s.type.color;ctx.setLineDash([3,2]);ctx.strokeRect(echo.x-8,echo.y-8,16,16);ctx.setLineDash([]);ctx.globalAlpha=1;}
    for(const [i] of s.satellites.entries()){const p=orbit(s,i);line(s.x,s.y,p.x,p.y,s.type.color+'66');ctx.fillStyle=s.type.color;ctx.fillRect(Math.round(p.x)-4,Math.round(p.y)-4,8,8);}
  }
  for(const p of shots){const sp=hypot(p.vx,p.vy);line(p.x-p.vx/sp*8,p.y-p.vy/sp*8,p.x+p.vx/sp*3,p.y+p.vy/sp*3,p.owner.type.color,3);}
  if(grip)line(grip.vamp.x,grip.vamp.y,grip.target.x,grip.target.y,'#ff5778',7);
  for(const s of balls){
    if(s.hp<=0)continue;
    for(const [i,[x,y]] of s.trail.entries()){
      ctx.globalAlpha=(i+1)*.043;ctx.fillStyle=s.type.color;ctx.fillRect(Math.round(x)-3,Math.round(y)-3,6,6);
    }ctx.globalAlpha=1;sprite(s);
  }
  for(const f of sparks){const u=(t-f.start)/.3,r=10+u*f.r;ctx.globalAlpha=1-u;ctx.strokeStyle=f.color;ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4,x=f.x+Math.cos(a)*r,y=f.y+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.stroke();}
  if(!reducedMotion?.matches)for(const p of particles){
    const age=t-p.start;ctx.globalAlpha=1-age/.48;ctx.fillStyle=p.color;
    ctx.fillRect(Math.round(p.x+p.vx*age),Math.round(p.y+p.vy*age+55*age*age),p.size,p.size);
  }
  for(const f of floats){
    const u=(t-f.start)/(f.crit?.85:.65);ctx.globalAlpha=1-u;ctx.fillStyle=f.color;
    ctx.font=f.crit?'900 20px system-ui':'bold 15px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    const x=clamp(f.x,f.crit?40:14,W-(f.crit?40:14)),y=clamp(f.y-17-u*20,12,W-9);
    if(f.crit){ctx.lineWidth=4;ctx.strokeStyle='#3d1e04';ctx.strokeText(f.label,x,y);}
    ctx.fillText(f.label,x,y);
  }
  ctx.globalAlpha=1;
}
</script>
